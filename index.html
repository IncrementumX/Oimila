<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Convite</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2213%22%3E%F0%9F%8D%B7%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg1:#fff7ed; --bg2:#fce7f3; --ink:#2b1b16; --muted:#765d55;
      --yes:#e11d48; --maybe:#f97316; --no:#64748b; --card:rgba(255,255,255,.72);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif; color:var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(251,113,133,.34), transparent 34%),
        radial-gradient(circle at 90% 80%, rgba(251,146,60,.28), transparent 36%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }
    .sparkles { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .sparkles span {
      position:absolute; width:8px; height:8px; border-radius:999px; background:rgba(225,29,72,.22);
      animation: float 8s ease-in-out infinite; filter: blur(.2px);
    }
    .sparkles span:nth-child(1){left:12%;top:18%;animation-delay:.1s}
    .sparkles span:nth-child(2){left:72%;top:16%;animation-delay:1.1s;width:12px;height:12px}
    .sparkles span:nth-child(3){left:84%;top:68%;animation-delay:2.1s}
    .sparkles span:nth-child(4){left:18%;top:74%;animation-delay:3.1s;width:10px;height:10px}
    .sparkles span:nth-child(5){left:49%;top:8%;animation-delay:4.1s}
    @keyframes float { 0%,100%{transform:translateY(0) scale(1);opacity:.45} 50%{transform:translateY(-22px) scale(1.25);opacity:.9} }
    .card {
      width:min(460px, 100%); padding:34px 24px 26px; border:1px solid rgba(120,53,15,.14);
      border-radius:32px; background:var(--card); backdrop-filter: blur(18px);
      box-shadow:0 24px 80px rgba(124,45,18,.16); text-align:center;
      transform:translateY(12px); opacity:0; animation: enter .7s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes enter { to { transform:translateY(0); opacity:1; } }
    .eyebrow { font:700 12px/1.2 ui-sans-serif, system-ui; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    h1 { margin:14px 0 12px; font-size:clamp(34px, 10vw, 54px); line-height:.96; letter-spacing:-.04em; }
    p { margin:0 auto 24px; max-width:31ch; color:var(--muted); font:500 16px/1.45 ui-sans-serif, system-ui; }
    .buttons { display:grid; gap:12px; margin-top:24px; }
    button {
      border:0; min-height:52px; border-radius:999px; padding:0 18px; color:white;
      font:800 16px/1 ui-sans-serif, system-ui; cursor:pointer;
      box-shadow:0 12px 28px rgba(15,23,42,.14); transform:translateY(0) scale(1);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform:translateY(1px) scale(.99); }
    button:hover { transform:translateY(-1px) scale(1.01); filter:saturate(1.04); }
    .yes { background:linear-gradient(135deg,#fb7185,var(--yes)); }
    .maybe { background:linear-gradient(135deg,#fdba74,var(--maybe)); }
    .no { background:linear-gradient(135deg,#94a3b8,var(--no)); }
    .status { margin-top:18px; min-height:22px; color:var(--muted); font:700 13px/1.4 ui-sans-serif, system-ui; }
    .done h1 { font-size:clamp(30px, 9vw, 46px); }
    .heart { display:inline-block; animation:pulse 1.05s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } .card{opacity:1;transform:none} }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <main class="card" id="card">
    <div class="eyebrow">convite oficial</div>
    <h1>Jantar comigo?</h1>
    <p>Prometo escolher um lugar bom, chegar no horário e fingir que pensei pouco antes de mandar isso.</p>
    <div class="buttons" id="buttons">
      <button class="yes" data-response="yes">Sim</button>
      <button class="maybe" data-response="maybe">Talvez, se o lugar for bom</button>
      <button class="no" data-response="no">Não, mas gostei da audácia</button>
    </div>
    <div class="status" id="status"></div>
  </main>
<script>
const SUPABASE_URL = 'https://oziequrhypzbfdynnnda.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96aWVxdXJoeXB6YmZkeW5ubmRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTU3OTEsImV4cCI6MjA4OTYzMTc5MX0.dU0_ISLUdDVAh0XQ4wLFlDXf4ZTOuRh__4_mcp0aFxo';
const INVITE_ID = 'dinner-2026-07';
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const card = document.getElementById('card');
const buttons = document.getElementById('buttons');
const statusEl = document.getElementById('status');
async function sendResponse(response) {
  statusEl.textContent = 'Enviando...';
  [...buttons.querySelectorAll('button')].forEach(b => b.disabled = true);
  const { error } = await client.from('personal_dinner_invite_responses').insert({
    invite_id: INVITE_ID,
    response,
    user_agent: navigator.userAgent,
    page_url: location.href
  });
  if (error) {
    statusEl.textContent = 'Não consegui registrar. Tenta de novo?';
    [...buttons.querySelectorAll('button')].forEach(b => b.disabled = false);
    console.error(error);
    return;
  }
  card.classList.add('done');
  const msg = response === 'yes'
    ? 'Perfeito. Agora eu tenho que escolher um lugar à altura. <span class="heart">♥</span>'
    : response === 'maybe'
      ? 'Talvez já é margem de segurança suficiente pra eu tentar convencer.'
      : 'Ok. Triste, mas estatisticamente honesto.';
  card.innerHTML = `<div class="eyebrow">resposta registrada</div><h1>${msg}</h1><p>Pode fechar esta página.</p>`;
}
buttons.addEventListener('click', e => {
  const b = e.target.closest('button[data-response]');
  if (!b) return;
  sendResponse(b.dataset.response);
});
</script>
</body>
</html>
